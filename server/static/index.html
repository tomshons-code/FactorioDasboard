<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Factorio Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/overview">
      <img src="favicon.svg" alt="">
      <span><b>Factorio Dashboard</b><small>factorio.houseinn.org</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot">Ładowanie…</div>
  </aside>

  <div class="main">
    <header class="top">
      <div>
        <h1 id="title">Przegląd</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">…</span></span>
      <button class="btn icon" id="themeBtn" title="Zmień motyw"></button>
      <button class="btn primary" id="refreshBtn"></button>
    </header>

    <main class="content">
      <section class="view" data-view="overview"></section>
      <section class="view" data-view="suggestions"></section>
      <section class="view" data-view="map"></section>
      <section class="view" data-view="production"></section>
      <section class="view" data-view="power"></section>
      <section class="view" data-view="mining"></section>
      <section class="view" data-view="research"></section>
      <section class="view" data-view="trends"></section>
    </main>
  </div>
</div>
<nav class="mobile-nav glass" id="mnav"></nav>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="map.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
